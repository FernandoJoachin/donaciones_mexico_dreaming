<template>
    <div class="pagina">
        <header class="banda">
            <span class="burbuja burbuja-a" aria-hidden="true"></span>
            <span class="burbuja burbuja-b" aria-hidden="true"></span>
            <div class="banda-contenido">
                <template lwc:if={etiqueta}>
                    <span class="etiqueta">{etiqueta}</span>
                </template>
                <h1 class="banda-titulo">{titulo}</h1>
                <template lwc:if={descripcion}>
                    <p class="banda-descripcion">{descripcion}</p>
                </template>
            </div>
        </header>
        <div class="contenedor">
            <div class="tabs">
                <button type="button" class={claseActivas} data-pestana="activas" aria-pressed={pulsadaActivas} onclick={cambiarPestana}>Activas</button>
                <button type="button" class={clasePasadas} data-pestana="pasadas" aria-pressed={pulsadaPasadas} onclick={cambiarPestana}>Pasadas</button>
            </div>

            <template lwc:if={cargando}>
                <p class="info">Cargando campañas…</p>
            </template>
            <template lwc:if={hayError}>
                <p class="error">No pudimos cargar las campañas. Intenta de nuevo en unos minutos.</p>
            </template>
            <template lwc:if={sinTarjetas}>
                <p class="vacio">{mensajeVacio}</p>
            </template>

            <ul class="lista">
                <template for:each={tarjetas} for:item="c">
                    <li key={c.id} class="campana">
                        <template lwc:if={c.imagen}>
                            <img class="campana-imagen" src={c.imagen} alt="" loading="lazy" onerror={ocultarImagen} />
                        </template>
                        <div class="campana-cabeza">
                            <h2 class="campana-nombre">{c.nombre}</h2>
                            <template lwc:if={c.cerrada}>
                                <span class="insignia">Cerrada</span>
                            </template>
                        </div>
                        <template lwc:if={c.descripcion}>
                            <p class="campana-texto">{c.descripcion}</p>
                        </template>
                        <template lwc:if={c.conMeta}>
                            <div class="cifras">
                                <span class="cifra-grande">{c.recaudado}</span>
                                <span class="cifra-meta">de {c.meta}</span>
                            </div>
                            <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={c.porcentaje} aria-label="Avance de la campaña">
                                <div class="barra-relleno" style={c.estiloBarra}></div>
                            </div>
                        </template>
                        <template lwc:elseif={c.hayRecaudado}>
                            <div class="cifras">
                                <span class="cifra-grande">{c.recaudado}</span>
                                <span class="cifra-meta">recaudados</span>
                            </div>
                        </template>
                        <template lwc:if={c.leyenda}>
                            <p class="leyenda">{c.leyenda}</p>
                        </template>
                        <template lwc:if={c.puedeDonar}>
                            <button type="button" class="btn btn-primario" data-id={c.id} onclick={verCampana}>{textoBotonVer}</button>
                        </template>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
