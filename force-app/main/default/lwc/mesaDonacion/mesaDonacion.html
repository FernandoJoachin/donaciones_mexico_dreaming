<template>
    <div class="pagina">
        <header class="banda">
            <span class="burbuja burbuja-a" aria-hidden="true"></span>
            <span class="burbuja burbuja-b" aria-hidden="true"></span>
            <div class="banda-contenido">
                <span class="etiqueta">México Dreaming</span>
                <h1 class="banda-titulo">Tu donativo</h1>
            </div>
        </header>
        <div class="contenedor">
            <template lwc:if={cargando}>
                <lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner>
            </template>

            <template lwc:if={error}>
                <p class="error" role="alert">{error}</p>
            </template>

            <template lwc:if={registrado}>
                <h2 class="titulo">¡Gracias, {invitacion.nombre}!</h2>
                <p class="intro">Registramos tu intención de donar. Tu donativo quedará confirmado cuando se reciba el pago.</p>
            </template>

            <template lwc:if={mostrarFormulario}>
                <h2 class="titulo">Sumarte a {invitacion.campana}</h2>

                <template lwc:if={invitacion.esEmpresa}>
                    <p class="empresa">
                        Donativo a nombre de <b>{invitacion.empresa}</b>. Si lo haces público, se mostrará el nombre de la empresa.
                    </p>
                </template>

                <lightning-radio-group
                    name="paquete"
                    label="Elige tu aportación"
                    options={opcionesPaquete}
                    value={paquete}
                    type="button"
                    onchange={cambioPaquete}
                ></lightning-radio-group>

                <template lwc:if={esAbierto}>
                    <lightning-input
                        type="text"
                        label="Monto a donar (MXN)"
                        placeholder="Ej. 2,500"
                        field-level-help={ayudaMonto}
                        data-campo="montoTexto"
                        value={montoTexto}
                        onchange={cambio}
                    ></lightning-input>
                </template>

                <p class="resumen">{resumenMonto}</p>

                <lightning-radio-group
                    name="visibilidad"
                    label="¿Cómo quieres que aparezca tu donativo?"
                    options={opcionesVisibilidad}
                    value={visibilidad}
                    data-campo="visibilidad"
                    onchange={cambio}
                    type="radio"
                ></lightning-radio-group>

                <template lwc:if={esPublico}>
                    <div class="publico">
                        <lightning-input type="url" label="LinkedIn (tu perfil o la página de tu empresa)" placeholder="https://www.linkedin.com/in/..." data-campo="linkedinUrl" value={linkedinUrl} onchange={cambio} required></lightning-input>
                        <lightning-input type="checkbox" label="Autorizo que se publique mi nombre (o el de mi empresa) y que se me mencione en una publicación de agradecimiento" data-campo="consentimientoPublicacion" checked={consentimientoPublicacion} onchange={cambio}></lightning-input>
                        <lightning-input type="checkbox" label="Mostrar también el monto de mi donativo" data-campo="mostrarMonto" checked={mostrarMonto} onchange={cambio}></lightning-input>
                    </div>
                </template>

                <lightning-input type="checkbox" label="He leído y acepto el aviso de privacidad" data-campo="aceptaAviso" checked={aceptaAviso} onchange={cambio}></lightning-input>
                <p class="aviso"><a href={avisoUrl} target="_blank" rel="noopener">Ver aviso de privacidad</a></p>

                <button type="button" class="btn btn-primario" onclick={enviar} disabled={cargando}>Continuar</button>
            </template>
        </div>
    </div>
</template>
