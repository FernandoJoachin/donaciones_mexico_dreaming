<template>
    <div class="contenedor">
        <template lwc:if={cargando}>
            <lightning-spinner alternative-text="Cargando" size="medium"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <p class="error" role="alert">{error}</p>
        </template>

        <template lwc:if={enviado}>
            <h2 class="titulo">¡Gracias, {invitacion.nombre}!</h2>
            <p>Guardamos tu información.</p>
            <lightning-button variant="brand" label="Continuar a donar" onclick={continuarADonar}></lightning-button>
        </template>

        <template lwc:if={mostrarFormulario}>
            <h2 class="titulo">Hola, {invitacion.nombre}</h2>
            <p class="intro">Actualiza tus datos para mantenernos en contacto. Campaña: {invitacion.campana}.</p>

            <lightning-input label="Generación" data-campo="generacion" value={generacion} onchange={cambio} maxlength="20"></lightning-input>
            <lightning-input label="Cuenta de Trailhead (enlace a tu perfil)" type="url" data-campo="cuentaTrailhead" value={cuentaTrailhead} onchange={cambio}></lightning-input>
            <lightning-textarea label="Certificaciones de Salesforce" data-campo="certificaciones" value={certificaciones} onchange={cambio} maxlength="255"></lightning-textarea>

            <lightning-input type="checkbox" label="Acepto recibir mensajes sobre próximos eventos de Salesforce y esta campaña" data-campo="consentimientoContacto" checked={consentimientoContacto} onchange={cambio}></lightning-input>
            <lightning-input type="checkbox" label="Prefiero darme de baja y no recibir mensajes" data-campo="darseDeBaja" checked={darseDeBaja} onchange={cambio}></lightning-input>

            <p class="aviso">
                Tus datos se usan solo para esta campaña y para avisarte de eventos, según nuestro
                <a href={avisoUrl} target="_blank" rel="noopener">aviso de privacidad</a>.
            </p>

            <lightning-button variant="brand" label="Guardar" onclick={guardar} disabled={cargando}></lightning-button>
        </template>
    </div>
</template>
