<template>
    <div class="pagina">
        <header class="banda">
            <span class="burbuja burbuja-a" aria-hidden="true"></span>
            <span class="burbuja burbuja-b" aria-hidden="true"></span>
            <div class="banda-contenido">
                <span class="etiqueta">México Dreaming</span>
                <h1 class="banda-titulo">Aviso de privacidad</h1>
                <p class="banda-sub">Versión {versionAviso} · Actualizado el {fechaActualizacion}</p>
            </div>
        </header>

        <article class="contenedor">
            <section class="resumen">
                <h2 class="resumen-titulo">En breve</h2>
                <ul>
                    <li>Pedimos tu correo y los datos de tu donativo para registrarlo, confirmar tu pago y agradecerte.</li>
                    <li>Tu donativo aparece en el muro de agradecimiento junto con el monto: con tu nombre (o el de tu empresa) si eliges "Pública", o como «Anónimo» si eliges "Anónima". Tu correo no se publica.</li>
                    <li>Puedes darte de baja de los avisos, o pedir acceso, corrección o eliminación de tus datos, cuando quieras.</li>
                </ul>
            </section>

            <section>
                <h2 class="seccion">1. ¿Quién es responsable de tus datos?</h2>
                <p>
                    <b>{responsableTexto}</b> es responsable del tratamiento de tus datos personales, conforme a la legislación
                    mexicana aplicable en materia de protección de datos personales en posesión de particulares.
                </p>
                <p>Domicilio: <span class={claseDomicilio}>{domicilioTexto}</span>.</p>
                <p>
                    Contacto para dudas y para ejercer tus derechos:
                    <template lwc:if={hayCorreo}>
                        <a href={enlaceCorreo}>{correoTexto}</a>.
                    </template>
                    <template lwc:else>
                        <span class="pendiente">{correoTexto}</span>.
                    </template>
                </p>
            </section>

            <section>
                <h2 class="seccion">2. ¿Qué datos recabamos?</h2>
                <ul>
                    <li><b>Identificación y contacto:</b> correo electrónico y, si eliges donar de forma pública, nombre y apellidos (o el nombre de tu empresa, si donas en su nombre). Si eliges donar de forma anónima, no te pedimos tu nombre.</li>
                    <li><b>LinkedIn</b> (opcional, solo en donativos públicos): el enlace a tu perfil o al de tu empresa.</li>
                    <li><b>Donativo:</b> paquete o monto, si es público o anónimo, fecha, estado del pago e identificador del pago en el proveedor de pagos.</li>
                    <li><b>Consentimientos:</b> qué aceptaste, cuándo y con qué versión de este aviso.</li>
                </ul>
                <p>Si tu correo ya estaba registrado, usamos ese mismo registro y no modificamos los datos que ya teníamos.</p>
                <p>No pedimos datos personales sensibles. Los datos de tu tarjeta o de tu forma de pago los trata el proveedor de pagos y no se guardan en nuestro sistema.</p>
            </section>

            <section>
                <h2 class="seccion">3. ¿Para qué usamos tus datos?</h2>
                <h3 class="subseccion">Finalidades necesarias</h3>
                <p>Sin ellas no podemos recibir tu donativo:</p>
                <ul>
                    <li>Identificarte y contactarte en relación con tu donativo y esta campaña.</li>
                    <li>Registrar tu donativo, confirmar el pago, darte seguimiento y agradecerte.</li>
                    <li>
                        Publicar tu donativo en el muro de agradecimiento del sitio: tu <b>nombre</b> (o el de tu empresa) o la palabra
                        «Anónimo», junto con el <b>monto</b>. El monto siempre se publica. Si no quieres que aparezca tu nombre,
                        elige la opción "Anónima".
                    </li>
                    <li>Administrar el sitio y evitar usos indebidos, como registros automatizados.</li>
                </ul>
                <h3 class="subseccion">Finalidades que requieren tu autorización</h3>
                <p>Las pedimos por separado y puedes negarte sin que afecte tu donativo:</p>
                <ul>
                    <li>Enviarte avisos sobre próximos eventos y donaciones. Al donar eliges "Sí" o "No".</li>
                    <li>Mencionarte en publicaciones de agradecimiento en LinkedIn, solo si nos das tu enlace.</li>
                </ul>
                <p>Lo que se publica es visible para cualquier persona que visite el sitio o la publicación.</p>
            </section>

            <section>
                <h2 class="seccion">4. ¿Con quién compartimos tus datos?</h2>
                <ul>
                    <li>Con el comité organizador, que puede ver tu correo y los datos de tu donativo. El correo no se publica.</li>
                    <li>Con la plataforma Salesforce, proveedor de tecnología donde se almacena la información.</li>
                    <li>Con Stripe, el proveedor de pagos, que procesa tu pago.</li>
                    <li>Con el público, únicamente lo que se publica en el muro según lo descrito arriba.</li>
                </ul>
                <p>No vendemos tus datos ni los compartimos con otras personas u organizaciones distintas a las anteriores.</p>
            </section>

            <section>
                <h2 class="seccion">5. Tus derechos</h2>
                <p>
                    Puedes pedir <b>acceso</b> a tus datos, su <b>rectificación</b> o <b>cancelación</b>, y <b>oponerte</b> a su uso
                    (derechos ARCO), así como <b>revocar</b> tu consentimiento.
                </p>
                <ul>
                    <li>Para dejar de recibir avisos, usa la <a href={bajaHref}>página de baja</a>.</li>
                    <li>Para cualquier otra solicitud, escribe al correo de contacto con tu nombre completo, el correo con el que donaste y qué quieres pedir. Te responderemos en los plazos que marca la ley.</li>
                    <li>Si ya publicamos tu nombre en el muro, puedes pedir que lo retiremos o lo cambiemos por «Anónimo». Lo que ya se haya publicado en LinkedIn lo retiramos en lo que dependa de nosotros.</li>
                </ul>
            </section>

            <section>
                <h2 class="seccion">6. ¿Cuánto tiempo conservamos tus datos?</h2>
                <p>Los conservamos <span class={clasePlazo}>{plazoTexto}</span>.</p>
            </section>

            <section>
                <h2 class="seccion">7. Tecnologías del sitio</h2>
                <p>
                    El sitio puede usar tecnologías necesarias para su funcionamiento, como cookies técnicas de la plataforma.
                    No las usamos para publicidad.
                </p>
            </section>

            <section>
                <h2 class="seccion">8. Cambios a este aviso</h2>
                <p>
                    Si este aviso cambia, publicaremos la nueva versión en esta misma página, con su número de versión y fecha.
                    Guardamos la versión que aceptaste al donar.
                </p>
            </section>
        </article>
    </div>
</template>
