<template>
    <header class="encabezado" onkeydown={teclaMenu}>
        <div class="barra">
            <a class="marca" href={urlInicio} aria-label="Ir al inicio">
                <span class="marca-icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
                        <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                    </svg>
                </span>
                <span class="marca-texto">
                    <span class="marca-nombre">{marca}</span>
                    <span class="marca-lema">{lema}</span>
                </span>
            </a>

            <nav class="navegacion" aria-label="Principal">
                <template for:each={enlaces} for:item="e">
                    <a key={e.id} class={e.clase} href={e.url} aria-current={e.actual}>{e.texto}</a>
                </template>
                <button type="button" class="enlace enlace-boton" onclick={abrirAyuda}>Ayuda</button>
                <a class="donar" href={urlDonar}>Donar</a>
            </nav>

            <div class="acciones-movil">
                <a class="donar donar-movil" href={urlDonar}>Donar</a>
                <button type="button" class="hamburguesa" aria-expanded={expandido} aria-controls="menu-movil" aria-label={etiquetaBoton} onclick={alternarMenu}>
                <span class="hamburguesa-linea"></span>
                <span class="hamburguesa-linea"></span>
                <span class="hamburguesa-linea"></span>
                </button>
            </div>
        </div>

        <nav id="menu-movil" class={claseMenu} aria-label="Menú móvil">
            <template for:each={enlaces} for:item="e">
                <a key={e.id} class={e.clase} href={e.url} aria-current={e.actual}>{e.texto}</a>
            </template>
            <button type="button" class="enlace enlace-boton" onclick={abrirAyuda}>Ayuda</button>
        </nav>
    </header>
</template>
